[build-system]
requires = ["scikit-build-core>=0.10,<1", "pybind11>=3,<4"]
build-backend = "scikit_build_core.build"

[project]
name = "miniima"
version = "0.2.2"
description = "A local-first document knowledge base CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12,<1",
  "rich>=13,<15",
  "numpy>=1.26,<3",
  "openai>=1.30,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "scikit-build-core>=0.10,<1", "pybind11>=3,<4", "cmake>=3.28,<5", "ninja>=1.11,<2"]

[project.scripts]
miniima = "miniima.cli:main"

[tool.scikit-build]
cmake.version = ">=3.20"
cmake.build-type = "Release"
wheel.packages = ["src/miniima"]
build-dir = "build/{wheel_tag}"
sdist.include = ["CMakeLists.txt", "cpp/**", "src/**", "tests/**", "docs/**", "examples/**", ".env.example"]

[tool.scikit-build.cmake.define]
BUILD_TESTING = "OFF"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
